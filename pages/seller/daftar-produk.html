<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daftar Produk - ON Shop Seller Centre</title>
  <link rel="icon" href="data:,">
  
  <!-- CSS Navigasi Terpadu & CSS Daftar Produk -->
  <link rel="stylesheet" href="../../assets/css/seller-css/seller-nav.css" />
  <link rel="stylesheet" href="../../assets/css/seller-css/daftar-produk.css" />
</head>
<body>
  <div class="seller-layout-container" style="display: flex; width: 100vw; max-width: 100vw; min-height: 100vh;">
    
    <!-- 1. SLOT SIDEBAR DESKTOP (Diisi otomatis oleh seller-nav-component.js) -->
    <div id="sellerSidebarSlot"></div>

    <!-- 2. KONTEN UTAMA DAFTAR PRODUK -->
    <main class="main-content" style="flex: 1; padding: 24px 30px 100px 30px; width: 100%; overflow-x: hidden;">
      <div class="page-title-row">
        <h2>Daftar Produk Toko</h2>
        <a href="tambah-produk.html" class="btn-add-product">+ Tambah Produk Baru</a>
      </div>

      <!-- Tab Filter Status ala Shopee -->
      <div class="tab-filter-bar">
        <button type="button" class="tab-btn active" data-status="all" onclick="handleTabClick('all', this)">
          Semua <span class="tab-count" id="countAll">0</span>
        </button>
        <button type="button" class="tab-btn" data-status="active" onclick="handleTabClick('active', this)">
          Aktif <span class="tab-count" id="countActive">0</span>
        </button>
        <button type="button" class="tab-btn" data-status="out_of_stock" onclick="handleTabClick('out_of_stock', this)">
          Habis <span class="tab-count" id="countOutOfStock">0</span>
        </button>
        <button type="button" class="tab-btn" data-status="archived" onclick="handleTabClick('archived', this)">
          Diarsipkan <span class="tab-count" id="countArchived">0</span>
        </button>
      </div>

      <!-- Toolbar Pencarian -->
      <div class="toolbar-card">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="searchInput"
            placeholder="Cari nama produk..."
            oninput="handleSearch()"
          />
        </div>
      </div>

      <!-- Tabel Inventaris Produk -->
      <div class="table-card">
        <table class="product-table">
          <thead>
            <tr>
              <th width="45%">Info Produk</th>
              <th width="15%">Harga Jual</th>
              <th width="15%">Total Stok</th>
              <th width="10%">Status</th>
              <th width="15%">Aksi</th>
            </tr>
          </thead>
          <tbody id="productTableBody">
            <!-- Dirender dinamis via JavaScript -->
          </tbody>
        </table>

        <div id="emptyState" class="empty-state hidden">
          <p>Tidak ada produk yang sesuai dengan filter atau pencarian Anda.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- 3. SLOT BOTTOM NAVIGATION MOBILE (Diisi otomatis oleh seller-nav-component.js) -->
  <div id="sellerBottomNavSlot"></div>

  <!-- TOAST NOTIFIKASI -->
  <div id="toastNotification" class="toast-box">
    <span class="toast-icon" id="toastIcon">✓</span>
    <span id="toastMessage">Berhasil!</span>
  </div>

  <!-- Skrip Terpusat Navigasi & Logika Daftar Produk -->
  <script src="../../assets/js/seller-js/seller-nav-component.js"></script>
  <script src="../../assets/js/seller-js/daftar-produk.js"></script>
</body>
</html>
