<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uji Coba Opsi B - Pengembalian di Riwayat Transaksi</title>
  <link rel="stylesheet" href="../../assets/css/buyer-css/navbar.css" />
  <link rel="stylesheet" href="../../assets/css/buyer-css/pesanan-saya.css" />
  <style>
    .badge-return-status {
      display: inline-block;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      background: #fef2f2;
      color: #ef4444;
      border: 1px solid #fecaca;
    }
    .dispute-info-box {
      background: #fff7ed;
      border: 1px dashed #fdba74;
      border-radius: 6px;
      padding: 10px 14px;
      margin: 10px 16px;
      font-size: 12px;
      color: #9a3412;
    }
  </style>
</head>
<body>

  <main class="order-page-container">
    <div class="page-title-box">
      <div class="title-header-flex">
        <div>
          <h2 id="mainPageTitle">Pesanan Saya (Pengujian Opsi B)</h2>
          <p id="mainPageSubtitle">Menu depan tetap 5 tab standar. Status pengembalian masuk ke Riwayat Transaksi.</p>
        </div>
        <!-- Tombol Toggle Riwayat Transaksi -->
        <button type="button" class="btn-toggle-history" id="btnToggleHistory" onclick="toggleHistoryView()">
          📜 Riwayat Transaksi
        </button>
      </div>
    </div>

    <!-- TAMPILAN 1: PESANAN AKTIF (5 TAB STANDAR) -->
    <div id="activeOrdersSection">
      <div class="status-tab-scroll-bar">
        <button type="button" class="status-tab-pill" onclick="switchActiveTab('unpaid', this)">
          Belum Dibayar <span class="pill-counter" id="cntUnpaid">0</span>
        </button>
        <button type="button" class="status-tab-pill" onclick="switchActiveTab('packed', this)">
          Sedang Dikemas <span class="pill-counter" id="cntPacked">0</span>
        </button>
        <button type="button" class="status-tab-pill" onclick="switchActiveTab('shipped', this)">
          Dalam Pengiriman <span class="pill-counter" id="cntShipped">0</span>
        </button>
        <button type="button" class="status-tab-pill active" onclick="switchActiveTab('arrived', this)">
          Barang Sampai <span class="pill-counter" id="cntArrived">0</span>
        </button>
        <button type="button" class="status-tab-pill" onclick="switchActiveTab('review', this)">
          Beri Penilaian <span class="pill-counter" id="cntReview">0</span>
        </button>
      </div>

      <section class="order-feed-section" id="activeFeedContainer"></section>
    </div>

    <!-- TAMPILAN 2: RIWAYAT TRANSAKSI (OPSI B) -->
    <div id="historySection" class="hidden">
      <div class="history-tabs-bar">
        <button type="button" class="history-tab-btn" onclick="switchHistoryTab('selesai', this)">
          ✅ Selesai (<span id="cntHistorySelesai">0</span>)
        </button>
        <button type="button" class="history-tab-btn active" onclick="switchHistoryTab('pengembalian', this)">
          🔄 Pengembalian (<span id="cntHistoryRetur">0</span>)
        </button>
        <button type="button" class="history-tab-btn" onclick="switchHistoryTab('dibatalkan', this)">
          ❌ Dibatalkan (<span id="cntHistoryBatal">0</span>)
        </button>
      </div>

      <section class="order-feed-section" id="historyFeedContainer"></section>
    </div>

  </main>

  <!-- MODAL POP-UP PENGAJUAN PENGEMBALIAN BARANG -->
  <div id="returnModal" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="modal-title text-danger">Ajukan Pengembalian Barang</h3>
      <p class="modal-subtitle" id="returnProductName">Nama Produk</p>

      <label class="modal-form-label">Alasan Pengembalian:</label>
      <select id="returnReasonSelect" class="modal-select-box">
        <option value="Barang rusak / cacat fisik saat diterima">Barang rusak / cacat fisik saat diterima</option>
        <option value="Produk tidak sesuai spesifikasi / salah varian">Produk tidak sesuai spesifikasi / salah varian</option>
        <option value="Aksesoris atau kelengkapan pesanan kurang">Aksesoris atau kelengkapan pesanan kurang</option>
      </select>

      <label class="modal-form-label">Keterangan Kendala:</label>
      <textarea id="returnNotesInput" placeholder="Ceritakan detail kendala produk Anda..." class="rating-textarea"></textarea>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeReturnModal()">Batal</button>
        <button type="button" class="btn-submit-review bg-danger" onclick="submitReturnDummy()">Kirim Pengajuan</button>
      </div>
    </div>
  </div>

  <script>
    let isHistoryMode = false;
    let currentActiveTab = 'arrived';
    let currentHistoryTab = 'pengembalian';
    let targetSubOrderId = null;

    let dummyOrders = [
      {
        sub_order_id: 201,
        sub_order_number: "ORD-20260927-002",
        shop_name: "Fantech Official Store",
        order_status: "DIKIRIM",
        delivered_at: "2026-09-27 10:00:00",
        product_name: "Fantech Atom 83 Mechanical Keyboard",
        variant_name: "Blue Switch - Putih",
        price: 320000,
        qty: 1,
        img: "https://placehold.co/100x100/2e8b57/ffffff?text=Keyboard",
        dispute: null
      },
      {
        sub_order_id: 202,
        sub_order_number: "ORD-20260920-001",
        shop_name: "Sneakers Hype",
        order_status: "SELESAI",
        product_name: "Sepatu Lari Ortuseight",
        variant_name: "Putih - 42",
        price: 350000,
        qty: 1,
        img: "https://placehold.co/100x100/2e8b57/ffffff?text=Sepatu",
        dispute: null
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      refreshView();
    });

    function updateCounters() {
      const arrived = dummyOrders.filter(o => o.order_status === "DIKIRIM" && o.delivered_at).length;
      const selesai = dummyOrders.filter(o => o.order_status === "SELESAI").length;
      const retur = dummyOrders.filter(o => o.order_status === "DIKOMPLAIN").length;

      document.getElementById('cntArrived').innerText = arrived;
      document.getElementById('cntHistorySelesai').innerText = selesai;
      document.getElementById('cntHistoryRetur').innerText = retur;
    }

    function toggleHistoryView() {
      isHistoryMode = !isHistoryMode;
      const activeSec = document.getElementById("activeOrdersSection");
      const histSec = document.getElementById("historySection");
      const btnToggle = document.getElementById("btnToggleHistory");
      const mainTitle = document.getElementById("mainPageTitle");

      if (isHistoryMode) {
        activeSec.classList.add("hidden");
        histSec.classList.remove("hidden");
        btnToggle.innerText = "📦 Kembali ke Pesanan Aktif";
        mainTitle.innerText = "Riwayat Transaksi";
      } else {
        activeSec.classList.remove("hidden");
        histSec.classList.add("hidden");
        btnToggle.innerText = "📜 Riwayat Transaksi";
        mainTitle.innerText = "Pesanan Saya (Pengujian Opsi B)";
      }
      renderView();
    }

    function switchActiveTab(tabKey, btnEl) {
      currentActiveTab = tabKey;
      document.querySelectorAll('#activeOrdersSection .status-tab-pill').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderView();
    }

    function switchHistoryTab(tabKey, btnEl) {
      currentHistoryTab = tabKey;
      document.querySelectorAll('.history-tab-btn').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderView();
    }

    function renderView() {
      if (isHistoryMode) {
        renderHistory();
      } else {
        renderActive();
      }
    }

    function renderActive() {
      const container = document.getElementById('activeFeedContainer');
      container.innerHTML = "";

      let filtered = [];
      if (currentActiveTab === 'arrived') {
        filtered = dummyOrders.filter(o => o.order_status === "DIKIRIM" && o.delivered_at);
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-order-state"><p>Tidak ada pesanan pada tab ini.</p></div>`;
        return;
      }

      filtered.forEach(order => {
        container.appendChild(buildOrderCard(order, false));
      });
    }

    function renderHistory() {
      const container = document.getElementById('historyFeedContainer');
      container.innerHTML = "";

      let filtered = [];
      if (currentHistoryTab === 'pengembalian') {
        filtered = dummyOrders.filter(o => o.order_status === "DIKOMPLAIN");
      } else if (currentHistoryTab === 'selesai') {
        filtered = dummyOrders.filter(o => o.order_status === "SELESAI");
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-order-state"><p>Belum ada transaksi di riwayat ini.</p></div>`;
        return;
      }

      filtered.forEach(order => {
        container.appendChild(buildOrderCard(order, true));
      });
    }

    function buildOrderCard(order, isHistory) {
      const card = document.createElement('div');
      card.className = "order-item-card";

      let disputeHtml = "";
      let actionsHtml = "";

      if (order.order_status === "DIKIRIM") {
        actionsHtml = `
          <button type="button" class="btn-action-outline" onclick="openReturnModal(${order.sub_order_id}, '${order.product_name}')">
            Ajukan Pengembalian
          </button>
          <button type="button" class="btn-action-primary" onclick="alert('Pesanan selesai!')">
            Barang Diterima
          </button>
        `;
      } else if (order.order_status === "DIKOMPLAIN") {
        disputeHtml = `
          <div class="dispute-info-box">
            <strong>Status Pengajuan:</strong> ${order.dispute?.status || 'Sedang Ditinjau'}<br>
            <strong>Alasan:</strong> ${order.dispute?.reason}<br>
            <em>"${order.dispute?.notes || '-'}"</em>
          </div>
        `;
        actionsHtml = `<span class="badge-return-status">Dalam Proses Pengembalian</span>`;
      } else if (order.order_status === "SELESAI") {
        actionsHtml = `<span style="font-size:12px; font-weight:bold; color:#2e8b57;">✔ Transaksi Selesai</span>`;
      }

      card.innerHTML = `
        <div class="order-card-header">
          <span class="order-shop-name">🏪 ${order.shop_name}</span>
          <span class="order-status-tag">${order.order_status}</span>
        </div>
        <div class="order-product-row">
          <div class="order-thumb-box">
            <img src="${order.img}" alt="${order.product_name}" class="order-thumb" />
          </div>
          <div class="order-info-box">
            <div class="order-prod-title">${order.product_name}</div>
            <span class="order-prod-variant">Varian: ${order.variant_name}</span>
            <span class="order-qty">x${order.qty}</span>
          </div>
          <div class="order-price-box">
            <span class="order-price">Rp ${(order.price * order.qty).toLocaleString('id-ID')}</span>
          </div>
        </div>
        ${disputeHtml}
        <div class="order-card-footer">
          <div class="order-total-sum">Total: <strong>Rp ${(order.price * order.qty).toLocaleString('id-ID')}</strong></div>
          <div class="order-action-buttons">${actionsHtml}</div>
        </div>
      `;
      return card;
    }

    function refreshView() {
      updateCounters();
      renderView();
    }

    function openReturnModal(subOrderId, prodName) {
      targetSubOrderId = subOrderId;
      document.getElementById('returnProductName').innerText = prodName;
      document.getElementById('returnNotesInput').value = "";
      document.getElementById('returnModal').classList.remove('hidden');
    }

    function closeReturnModal() {
      targetSubOrderId = null;
      document.getElementById('returnModal').classList.add('hidden');
    }

    function submitReturnDummy() {
      const reason = document.getElementById('returnReasonSelect').value;
      const notes = document.getElementById('returnNotesInput').value.trim();

      const target = dummyOrders.find(o => o.sub_order_id === targetSubOrderId);
      if (target) {
        target.order_status = "DIKOMPLAIN";
        target.dispute = {
          reason: reason,
          notes: notes || "Tidak ada catatan.",
          status: "Menunggu Respon Penjual"
        };
      }

      closeReturnModal();
      alert("Pengajuan pengembalian berhasil dikirim! Pesanan dialihkan ke 'Riwayat Transaksi' -> sub-tab 'Pengembalian'.");

      // Beralih otomatis ke Tampilan Riwayat -> sub-tab Pengembalian
      if (!isHistoryMode) toggleHistoryView();
      const returTabBtn = document.querySelectorAll('.history-tab-btn')[1];
      switchHistoryTab('pengembalian', returTabBtn);
      refreshView();
    }
  </script>
</body>
</html>
