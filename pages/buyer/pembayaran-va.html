<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pembayaran Virtual Account - ON Shop</title>
    <link rel="stylesheet" href="../../assets/css/buyer-css/navbar.css" />
    <link rel="stylesheet" href="../../assets/css/buyer-css/va.css">
</head>
<body>

    <div class="payment-container">
        <div class="payment-card">
            <h2>Pembayaran Virtual Account</h2>
            <p class="bank-title-text" id="bankNameDisplay">BCA Virtual Account</p>

            <div class="va-display-box">
                <span class="va-label">Nomor Virtual Account:</span>
                <span class="va-number" id="vaNumberDisplay">8801 2948 1029 3840</span>
            </div>

            <div class="bill-amount-box">
                <span class="bill-amount-label">Total Tagihan:</span>
                <span class="bill-amount-val" id="vaGrandTotal">Rp 0</span>
            </div>

            <div class="detect-timer-notice" id="timerNotice">
                <span>🔄</span>
                <span>Mendeteksi transfer otomatis (<strong id="countdownText">5 detik</strong>)...</span>
            </div>
        </div>
    </div>

    <!-- Modal Notifikasi Sukses -->
    <div id="paymentSuccessModal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-icon">✅</div>
            <h3 class="modal-title">Pembayaran Terverifikasi!</h3>
            <p class="modal-desc">
                Tagihan lunas. Pesanan Anda kini berstatus <strong>Sedang Dikemas</strong> dan diteruskan ke toko.
            </p>
            <button type="button" class="btn-modal-action" onclick="redirectToOrders()">
                Lihat Pesanan Saya
            </button>
        </div>
    </div>

    <script src="../../assets/js/buyer-js/va.js"></script>
</body>
</html>
