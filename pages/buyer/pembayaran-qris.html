<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pembayaran QRIS - ON Shop</title>
    <link rel="stylesheet" href="../../assets/css/buyer-css/navbar.css" />
    <link rel="stylesheet" href="../../assets/css/buyer-css/qris.css">
</head>
<body>

    <div class="payment-container">
        <div class="payment-card">
            <h2>Pembayaran QRIS</h2>
            <p class="payment-desc">Scan kode QR menggunakan e-wallet (GoPay, OVO, DANA) atau mobile banking.</p>

            <div class="qr-wrapper">
                <img
                    id="qrisImgDisplay"
                    src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=ONSHOP_SIMULASI_QRIS"
                    alt="QRIS Code"
                    class="qr-img"
                />
            </div>

            <div class="bill-amount-box">
                <span class="bill-amount-label">Total Tagihan:</span>
                <span class="bill-amount-val" id="qrisGrandTotal">Rp 0</span>
            </div>

            <button type="button" class="btn-confirm-pay" id="btnPayQris" onclick="handlePaySuccess()">
                Simulasi Pembayaran Selesai
            </button>
        </div>
    </div>

    <!-- Modal Notifikasi Sukses -->
    <div id="paymentSuccessModal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-icon">✅</div>
            <h3 class="modal-title">Pembayaran QRIS Sukses!</h3>
            <p class="modal-desc">
                Status pesanan Anda telah diperbarui menjadi <strong>Sedang Dikemas</strong> dan diteruskan ke penjual.
            </p>
            <button type="button" class="btn-modal-action" onclick="redirectToOrders()">
                Lihat Pesanan Saya
            </button>
        </div>
    </div>

    <script src="../../assets/js/buyer-js/qris.js"></script>
</body>
</html>
